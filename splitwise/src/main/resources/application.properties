spring.application.name=splitwise
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${POSTGRES_DB_URL}
spring.datasource.username=${POSTGRES_USERNAME}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${POSTGRES_MAX_POOL_SIZE}
spring.datasource.hikari.minimum-idle=${POSTGRES_MIN_IDLE}
spring.datasource.hikari.idle-timeout=${POSTGRES_IDLE_TIMEOUT}
spring.datasource.hikari.connection-timeout=${POSTGRES_CONNECTION_TIMEOUT}
spring.datasource.hikari.pool-name=${POSTGRES_POOL_NAME}

flyway.enabled=true
flyway.locations=classpath:db/migration

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true